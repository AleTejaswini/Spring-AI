spring.application.name=ollama-demo
server.port=8081

# Chat still goes to your local LLM (Ollama default port).
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Your server returned 501 on embeddings ("Start it with --embeddings").
# Disable Ollama embeddings and use the on-device Transformers model instead.
spring.ai.ollama.embedding.enabled=false

app.data-init.enabled=true
